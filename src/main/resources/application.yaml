spring:
  application:
    name: authserver
  web:
    error:
      whitelabel:
        enabled: false
      include-message: always
      include-binding-errors: always
      include-stacktrace: never
      include-exception: true
  datasource:
    url: jdbc:h2:mem:db
    username: sa
    password: sa
  jpa:
    show-sql: true
    open-in-view: true
  h2:
    console:
      enabled: true

  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    use-root-path: true

security:
  jwt:
    secret: ${JWT_SECRET:surfshop-dev-secret-key-change-me-in-production}
    expiration-minutes: 120

logging:
  file:
    path: ./logs
